name: Phase 8 Recovery

on:
  push:
    branches:
      - phase-8-robustness
    paths:
      - .github/workflows/phase8-recovery.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run containing the original Phase 8 unit artifacts
        required: true
        default: "34101494390"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '34101494390' }}
  SCIENTIFIC_COMMIT: e4b36459f5030eb49326d129c9cf8b0c761e8d77
  PHASE8_SCIENTIFIC_COMMIT_SHORT: e4b3645

jobs:
  recover:
    name: recover ${{ matrix.dataset }} / seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - dataset: covertype
            seed: 43
          - dataset: covertype
            seed: 50
          - dataset: human_activity_recognition
            seed: 43
          - dataset: human_activity_recognition
            seed: 44
          - dataset: human_activity_recognition
            seed: 45
          - dataset: human_activity_recognition
            seed: 46
          - dataset: human_activity_recognition
            seed: 47
          - dataset: human_activity_recognition
            seed: 48
          - dataset: human_activity_recognition
            seed: 49
          - dataset: human_activity_recognition
            seed: 50
          - dataset: human_activity_recognition
            seed: 51
          - dataset: human_activity_recognition
            seed: 52

    steps:
      - name: Check out recovery control code
        uses: actions/checkout@v4
        with:
          path: control

      - name: Check out original scientific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_COMMIT }}
          path: scientific

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scientific/pyproject.toml

      - name: Install original project and baseline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./scientific[dev,baselines]"

      - name: Test recovery controller
        run: |
          python -m pytest control/tests/test_phase8_recovery.py -q

      - name: Cache frozen dataset archive
        uses: actions/cache@v4
        with:
          path: scientific/outputs/_datasets
          key: phase8-dataset-${{ matrix.dataset }}-v1

      - name: Restore original unit artifact
        uses: actions/download-artifact@v4
        with:
          name: phase8-unit-${{ matrix.dataset }}-${{ matrix.seed }}
          path: scientific/outputs/phase8_robustness
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Recover incomplete unit from frozen artifacts
        env:
          PHASE8_RECOVERY_CONTROL_SHA: ${{ github.sha }}
        run: |
          python control/experiments/13_phase8_recover.py \
            --config scientific/configs/phase8_robustness.yaml \
            --repository-root scientific \
            --output-dir scientific/outputs/phase8_robustness \
            --dataset "${{ matrix.dataset }}" \
            --seed "${{ matrix.seed }}" \
            --source-run-id "${SOURCE_RUN_ID}"

      - name: Upload recovered unit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-recovered-${{ matrix.dataset }}-${{ matrix.seed }}
          path: scientific/outputs/phase8_robustness
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate recovered Phase 8 statistics
    runs-on: ubuntu-latest
    needs: recover
    timeout-minutes: 90
    steps:
      - name: Check out original scientific commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_COMMIT }}
          path: scientific

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scientific/pyproject.toml

      - name: Install original project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./scientific[dev]"

      - name: Download all original Phase 8 unit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase8-unit-*
          path: scientific/outputs/phase8_robustness
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Overlay recovered units
        uses: actions/download-artifact@v4
        with:
          pattern: phase8-recovered-*
          path: scientific/outputs/phase8_robustness
          merge-multiple: true

      - name: Rebuild paired Phase 8 statistics without fitting
        run: |
          python scientific/experiments/12_robustness_statistics.py \
            --config scientific/configs/phase8_robustness.yaml \
            --aggregate-only \
            --output-dir scientific/outputs/phase8_robustness

      - name: Write recovery aggregate provenance
        env:
          PHASE8_RECOVERY_CONTROL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("scientific/outputs/phase8_robustness/phase8_recovery_aggregate.json")
          path.write_text(json.dumps({
              "status": "PASS",
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "scientific_code_version": os.environ["PHASE8_SCIENTIFIC_COMMIT_SHORT"],
              "recovery_control_commit": os.environ["PHASE8_RECOVERY_CONTROL_SHA"],
              "recovered_units": 12,
              "original_successful_units_reused": 18,
              "scientific_grid_changed": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload aggregate outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase8-aggregate-recovered
          path: |
            scientific/outputs/phase8_robustness/phase8_all_results.csv
            scientific/outputs/phase8_robustness/phase8_all_subject_results.csv
            scientific/outputs/phase8_robustness/phase8_paired_size_effects.csv
            scientific/outputs/phase8_robustness/phase8_paired_accuracy_effects.csv
            scientific/outputs/phase8_robustness/phase8_matched_standard_effects.csv
            scientific/outputs/phase8_robustness/phase8_accuracy_loss_sensitivity_effects.csv
            scientific/outputs/phase8_robustness/phase8_subset_size_sensitivity_effects.csv
            scientific/outputs/phase8_robustness/phase8_rank_stability_pairs.csv
            scientific/outputs/phase8_robustness/phase8_rank_stability_summary.csv
            scientific/outputs/phase8_robustness/phase8_har_subject_effects.csv
            scientific/outputs/phase8_robustness/phase8_precision_decision.json
            scientific/outputs/phase8_robustness/phase8_protocol.json
            scientific/outputs/phase8_robustness/phase8_recovery_aggregate.json
          if-no-files-found: error
          retention-days: 30
