name: Phase 9 figure bundle

on:
  push:
    branches: [phase-9-paper-preparation]
    paths:
      - '.github/workflows/phase9-figure-bundle.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen figure files
        run: |
          set -euo pipefail
          ls -lh paper/phase9_outputs/figures/figure_f1_primary_effects.png \
                 paper/phase9_outputs/figures/figure_f2_overlap_stability.png \
                 paper/phase9_outputs/figures/figure_f3_sensitivity_small_nn.png \
                 paper/phase9_outputs/figures/figure_f4_scaling_interaction.png \
                 paper/phase9_outputs/figures/figure_f5_har_subject_effects.png
      - name: Upload figure bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase9-figures-bundle
          path: |
            paper/phase9_outputs/figures/figure_f1_primary_effects.png
            paper/phase9_outputs/figures/figure_f2_overlap_stability.png
            paper/phase9_outputs/figures/figure_f3_sensitivity_small_nn.png
            paper/phase9_outputs/figures/figure_f4_scaling_interaction.png
            paper/phase9_outputs/figures/figure_f5_har_subject_effects.png
          if-no-files-found: error
          retention-days: 1
