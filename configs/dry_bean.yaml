experiment_name: dry_bean_phase7
phase: 7
seed: 43
dataset:
  kind: dry_bean
  n_samples: 13611
  n_features: 16
  n_classes: 7
  archive_path: outputs/_datasets/dry_bean_dataset.zip
  source_url: https://archive.ics.uci.edu/static/public/602/dry%2Bbean%2Bdataset.zip
  archive_sha256: 0a64eff5be87f48c3dbbfc0a12a56c5d5b5167ef8e61cd45d69b3e7c7130c06f
split:
  train: 6805
  tune: 2268
  calibration: 2269
  test: 2269
models:
  logistic_regression:
    type: logistic_regression
    C: 1.0
    max_iter: 1000
  small_neural_network:
    type: mlp
    hidden_layers: [64, 32]
    activation: relu
    weight_decay: 0.0001
    batch_size: 128
    learning_rate: 0.001
    max_epochs: 200
    early_stopping: true
    validation_fraction: 0.1
    patience: 15
temperature:
  grid: [1.0, 1.1, 1.2, 1.4, 1.6, 1.8, 2.0, 2.5, 3.0]
  confts_threshold_fraction: 0.5
  reject_zero_probabilities: true
  reject_saturated_probabilities: true
conformal:
  alpha: 0.10
  scores: [aps, raps]
  raps_lambda: 0.001
  raps_k_reg: 1
metrics:
  ece_bins: 15
  min_sscv_stratum_size: 25
stability:
  max_coverage_deviation: 0.03
  minimum_accuracy: 0.50
selection:
  max_accuracy_loss: 0.01
  max_coverage_deviation: 0.01
harm:
  primary_formulation: constrained
  selection_resamples: 5
  crossfit_folds: 4
  scale_share_of_remainder: 0.60
  constraints:
    max_accuracy_loss: 0.01
    max_coverage_shortfall: 0.03
  weights:
    beta: 4.0
    gamma: 10.0
    eta: 1.0
progressive_selection:
  scaling: base
  score: aps
  selection_resamples: 5
  crossfit_folds: 4
  max_removals: 15
  require_positive_incremental_gain: true
baselines:
  random_repetitions: 10
  permutation_repeats: 10
  crfe_lambda: 0.5
  shap_background_size: 30
  shap_evaluation_size: 20
  shap_max_evaluations: 33
scaling_interaction:
  methods:
    - all_features
    - mutual_information
    - permutation_importance
    - rfe
    - shap
    - crfe
    - conformal_harm_one_shot
    - conformal_harm_recursive
  descriptive_interaction_tolerance: 0.01
