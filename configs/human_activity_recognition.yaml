experiment_name: human_activity_recognition_phase7c
phase: 7
seed: 45
dataset:
  kind: human_activity_recognition
  n_samples: 10299
  n_features: 561
  n_classes: 6
  n_subjects: 30
  archive_path: outputs/_datasets/human_activity_recognition.zip
  source_url: https://archive.ics.uci.edu/static/public/240/human%2Bactivity%2Brecognition%2Busing%2Bsmartphones.zip
  archive_sha256: c00b803081a5c797cd5e4b83700a9810b38d53d9d84e01917e090e1fdbc81031
split:
  unit: groups
  train: 15
  tune: 5
  calibration: 5
  test: 5
  candidate_permutations: 4096
models:
  logistic_regression:
    type: logistic_regression
    C: 1.0
    max_iter: 500
  small_neural_network:
    type: mlp
    hidden_layers: [64, 32]
    activation: relu
    weight_decay: 0.0001
    batch_size: 128
    learning_rate: 0.001
    max_epochs: 60
    early_stopping: true
    validation_fraction: 0.1
    patience: 8
temperature:
  grid: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4, 1.6, 2.0]
  confts_threshold_fraction: 0.5
  reject_zero_probabilities: true
  reject_saturated_probabilities: true
conformal:
  alpha: 0.10
  scores: [aps, raps]
  raps_lambda: 0.001
  raps_k_reg: 1
metrics:
  ece_bins: 15
  min_sscv_stratum_size: 50
stability:
  max_coverage_deviation: 0.02
  minimum_accuracy: 0.75
coverage_validation:
  mode: grouped
  confidence_level: 0.95
selection:
  max_accuracy_loss: 0.01
  max_coverage_deviation: 0.02
harm:
  primary_formulation: constrained
  selection_resamples: 5
  crossfit_folds: 4
  scale_share_of_remainder: 0.60
  constraints:
    max_accuracy_loss: 0.01
    max_coverage_shortfall: 0.03
  weights:
    beta: 4.0
    gamma: 10.0
    eta: 1.0
progressive_selection:
  scaling: base
  score: aps
  selection_resamples: 5
  crossfit_folds: 4
  max_removals: 5
  require_positive_incremental_gain: true
baselines:
  random_repetitions: 10
  permutation_repeats: 10
  crfe_lambda: 0.5
  shap_background_size: 20
  shap_evaluation_size: 10
  shap_max_evaluations: 1123
scaling_interaction:
  methods:
    - all_features
    - mutual_information
    - permutation_importance
    - rfe
    - shap
    - crfe
    - conformal_harm_one_shot
    - conformal_harm_recursive
  descriptive_interaction_tolerance: 0.01
